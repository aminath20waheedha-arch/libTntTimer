name: Decompile .so and Save to Repo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Analysis Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils

    - name: Process and Decompile .so Files
      run: |
        mkdir -p decompiled
        
        find . -name "*.so" -not -path "./decompiled/*" | while read -r file; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            echo "Processing $filename..."
            strings "$file" > "decompiled/${filename}_strings.txt"
            readelf -sW "$file" > "decompiled/${filename}_symbols.txt" || true
            readelf -hW "$file" > "decompiled/${filename}_headers.txt" || true
            objdump -d "$file" > "decompiled/${filename}_disassembly.asm" || true
          fi
        done

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add decompiled/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: add decompiled text files"
          git push
        fi          fi
        done

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add decompiled/
        git commit -m "chore: add decompiled text files" || exit 0
        git push          fi
        done

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add decompiled/
        git commit -m "chore: add decompiled text files" || exit 0
        git push        done

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add decompiled/
        git commit -m "chore: add decompiled text files" || exit 0
        git push        done

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add decompiled/
        git commit -m "chore: add decompiled text files" || exit 0
        git push
