name: Decompile .so and Export Zip

on:
  push:
    paths:
      - '**.so'
  workflow_dispatch:

jobs:
  decompile-and-zip:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Analysis Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils unzip zip

    - name: Process and Decompile .so Files
      run: |
        mkdir -p decompiled_output
        
        for file in *.so; do
          if [ -f "$file" ]; then
            echo "Processing $file..."
            
            # Extract printable strings
            strings "$file" > "decompiled_output/${file}_strings.txt"
            
            # Dump dynamic dynamic symbols
            readelf -sW "$file" > "decompiled_output/${file}_symbols.txt" || true
            
            # Extract header and section layout
            readelf -hW "$file" > "decompiled_output/${file}_headers.txt" || true
            
            # Disassemble executable sections into assembly code
            objdump -d "$file" > "decompiled_output/${file}_disassembly.asm" || true
          fi
        done

    - name: Create Zip Archive
      run: |
        cd decompiled_output
        zip -r ../decompiled_results.zip .

    - name: Upload Zip as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Decompiled-SO-Package
        path: decompiled_results.zip
