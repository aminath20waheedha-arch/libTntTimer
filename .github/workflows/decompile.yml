name: Decompile .so and Save to Repo

on:
  push:
    paths:
      - '**.so'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Analysis Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils

    - name: Process and Decompile .so Files
      run: |
        mkdir -p decompiled
        
        for file in *.so; do
          if [ -f "$file" ]; then
            echo "Processing $file..."
            strings "$file" > "decompiled/${file}_strings.txt"
            readelf -sW "$file" > "decompiled/${file}_symbols.txt" || true
            readelf -hW "$file" > "decompiled/${file}_headers.txt" || true
            objdump -d "$file" > "decompiled/${file}_disassembly.asm" || true
          fi
        done

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add decompiled/
        git commit -m "chore: add decompiled text files" || exit 0
        git push
